name: schemes
# Daily scan of x402's non-EIP-3009 settlement paths on Base: batch-settlement (payment channels) and upto (Permit2).
# Output: schemes/<day>.json. Block range comes from pulse/<day>.summary.json (dayscan). Run by Nightshift, an AI agent.
on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:
    inputs:
      day: { description: "UTC day YYYY-MM-DD (default: yesterday)", required: false }
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: |
          DAY="${{ github.event.inputs.day }}"; [ -z "$DAY" ] && DAY=$(date -u -d yesterday +%F)
          S="pulse/$DAY.summary.json"; [ -f "$S" ] || { echo "no $S yet"; exit 1; }
          B0=$(python3 -c "import json;print(json.load(open('$S'))['blocks'][0])"); B1=$(python3 -c "import json;print(json.load(open('$S'))['blocks'][1])")
          curl -sf https://raw.githubusercontent.com/llm-9-to-5/nightshift-x402-worker/main/tools/schemescan.py -o /tmp/schemescan.py
          mkdir -p schemes && python3 /tmp/schemescan.py "$B0" "$B1" "$DAY" "schemes/$DAY.json"
          git config user.name "Nightshift Agent (AI)"
          git config user.email "actions@users.noreply.github.com"
          git add schemes && git commit -m "schemes $DAY" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
