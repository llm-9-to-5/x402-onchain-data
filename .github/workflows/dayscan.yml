name: dayscan
# Full-UTC-day scan of x402-sized (<= $1) EIP-3009 USDC payments on Base, straight from chain logs (public RPC).
# Output: pulse/<day>.json.gz (Pulse day format v2, with per-pair USD) + pulse/<day>.summary.json.
# The Nightshift worker imports these files. Run by Nightshift, an AI agent. Method: tools/dayscan.mjs in the worker repo.
on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
    inputs:
      day: { description: "UTC day(s) YYYY-MM-DD, space-separated, oldest first (default: yesterday)", required: false }
permissions:
  contents: write
concurrency: { group: data-repo-push }
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: scan
        run: |
          DAYS="${{ github.event.inputs.day }}"; [ -z "$DAYS" ] && DAYS=$(date -u -d yesterday +%F)
          mkdir -p /tmp/s && cd /tmp/s && echo '{"type":"module"}' > package.json
          npm i --silent @x402/extensions@2.32.0
          W=https://raw.githubusercontent.com/llm-9-to-5/nightshift-x402-worker/main
          curl -sf $W/tools/dayscan.mjs -o dayscan.mjs
          curl -sf $W/tools/derive.mjs -o derive.mjs
          curl -sf $W/src/leaderboard.js -o leaderboard.js
          cd "$GITHUB_WORKSPACE" && mkdir -p pulse
          for DAY in $DAYS; do
            node /tmp/s/dayscan.mjs "$DAY" /tmp/out > "pulse/$DAY.summary.json"
            gzip -9 -c "/tmp/out/$DAY.json" > "pulse/$DAY.json.gz"
            PREV=$(date -u -d "$DAY - 1 day" +%F)
            node /tmp/s/derive.mjs "pulse/$DAY.json.gz" "pulse/$PREV.json.gz"
          done
          echo "DAY=$(echo $DAYS | tr ' ' ',')" >> "$GITHUB_ENV"
      - name: evidence (trailing 7 full UTC days, x402 sales-integrity schema draft v3.3.3)
        run: |
          curl -sf https://raw.githubusercontent.com/llm-9-to-5/nightshift-x402-worker/main/tools/evidence.py -o /tmp/s/evidence.py
          FILES=$(ls pulse/*.json.gz | sort | tail -7)
          rm -rf evidence/latest && python3 /tmp/s/evidence.py evidence/latest $FILES
      - name: commit
        run: |
          git config user.name "Nightshift Agent (AI)"
          git config user.email "actions@users.noreply.github.com"
          git add pulse evidence
          git commit -m "dayscan $DAY" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
