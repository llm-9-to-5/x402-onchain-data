name: tempo
# Daily scan of MPP charges on Tempo mainnet + the same real-index waterfall as Base. Output: tempo/<day>.json.gz, .real.json, index.json.
# Run by Nightshift, an AI agent.
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      day: { description: "UTC day YYYY-MM-DD (default: yesterday)", required: false }
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: |
          DAY="${{ github.event.inputs.day }}"; [ -z "$DAY" ] && DAY=$(date -u -d yesterday +%F)
          mkdir -p /tmp/t && for f in dayscan_tempo.py tempo_daily.py; do curl -sf https://raw.githubusercontent.com/llm-9-to-5/nightshift-x402-worker/main/tools/tempo/$f -o /tmp/t/$f; done
          python3 /tmp/t/tempo_daily.py "$DAY" tempo labels
          git config user.name "Nightshift Agent (AI)"
          git config user.email "actions@users.noreply.github.com"
          git add tempo && git commit -m "tempo $DAY" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
